<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Club Session Dashboard</title>
<style>
  :root{
    --navy:#0b2e59;
    --blue:#1957a6;
    --blue-mid:#2f74d0;
    --blue-pale:#eaf1fb;
    --blue-line:#d3e2f7;
    --white:#ffffff;
    --paper:#f6f9fd;
    --ink:#12233d;
    --muted:#5b7191;
    --red:#c0311c;
    --red-bg:#fbe9e6;
    --amber:#a5680a;
    --amber-bg:#fbf0dc;
    --green:#1c7a4d;
    --green-bg:#e6f5ee;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    background:var(--paper);
    color:var(--ink);
  }
  header{
    background:var(--navy);
    color:var(--white);
    padding:22px 28px;
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    flex-wrap:wrap;
    gap:12px;
    border-bottom:4px solid var(--blue-mid);
  }
  header h1{
    margin:0;
    font-size:1.4rem;
    font-weight:600;
    letter-spacing:0.2px;
  }
  header p{
    margin:4px 0 0;
    color:#c6d9f2;
    font-size:0.85rem;
  }
  #last-updated{
    font-size:0.8rem;
    color:#c6d9f2;
    text-align:right;
  }
  main{
    max-width:1180px;
    margin:0 auto;
    padding:24px 20px 60px;
  }
  .stat-row{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:14px;
    margin-bottom:22px;
  }
  .stat-card{
    background:var(--white);
    border:1px solid var(--blue-line);
    border-radius:var(--radius);
    padding:14px 16px;
  }
  .stat-card .num{
    font-size:1.7rem;
    font-weight:700;
    color:var(--navy);
    line-height:1.1;
  }
  .stat-card .num.red{color:var(--red);}
  .stat-card .num.amber{color:var(--amber);}
  .stat-card .label{
    font-size:0.78rem;
    color:var(--muted);
    margin-top:4px;
  }
  .panel{
    background:var(--white);
    border:1px solid var(--blue-line);
    border-radius:var(--radius);
    margin-bottom:22px;
    overflow:hidden;
  }
  .panel-head{
    padding:14px 18px;
    border-bottom:1px solid var(--blue-line);
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:10px;
    background:var(--blue-pale);
  }
  .panel-head h2{
    margin:0;
    font-size:0.95rem;
    color:var(--navy);
  }
  .panel-body{padding:16px 18px;}

  /* school bars */
  .school-bar-row{
    display:grid;
    grid-template-columns:170px 1fr 46px;
    align-items:center;
    gap:10px;
    margin-bottom:10px;
    font-size:0.85rem;
  }
  .school-bar-row .name{color:var(--ink); overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .bar-track{
    background:var(--blue-pale);
    border-radius:6px;
    height:14px;
    overflow:hidden;
  }
  .bar-fill{
    height:100%;
    background:linear-gradient(90deg,var(--blue-mid),var(--blue));
    border-radius:6px 0 0 6px;
  }
  .school-bar-row .score{color:var(--muted); text-align:right;}

  /* filters */
  .filters{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    align-items:center;
  }
  select, input[type=text]{
    font:inherit;
    font-size:0.85rem;
    padding:7px 10px;
    border:1px solid var(--blue-line);
    border-radius:7px;
    background:var(--white);
    color:var(--ink);
  }
  .toggle-group{display:flex; border:1px solid var(--blue-line); border-radius:7px; overflow:hidden;}
  .toggle-group button{
    border:none;
    background:var(--white);
    padding:7px 12px;
    font-size:0.82rem;
    cursor:pointer;
    color:var(--muted);
  }
  .toggle-group button.active{
    background:var(--blue);
    color:var(--white);
  }

  /* cards list */
  .entry{
    border:1px solid var(--blue-line);
    border-radius:var(--radius);
    margin-bottom:12px;
    overflow:hidden;
  }
  .entry.sev-major{border-color:#e4b3aa;}
  .entry-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    padding:12px 16px;
    cursor:pointer;
    background:var(--white);
    flex-wrap:wrap;
  }
  .entry.resolved .entry-head{opacity:0.55;}
  .entry-title{display:flex; flex-direction:column; gap:2px;}
  .entry-title .school{font-weight:600; color:var(--navy); font-size:0.95rem;}
  .entry-title .meta{font-size:0.78rem; color:var(--muted);}
  .badges{display:flex; gap:6px; flex-wrap:wrap; align-items:center;}
  .badge{
    font-size:0.72rem;
    font-weight:600;
    padding:3px 9px;
    border-radius:999px;
    white-space:nowrap;
  }
  .badge.major{background:var(--red-bg); color:var(--red);}
  .badge.minor{background:var(--amber-bg); color:var(--amber);}
  .badge.ok{background:var(--green-bg); color:var(--green);}
  .badge.resolved{background:var(--blue-pale); color:var(--blue);}
  .entry-body{
    display:none;
    padding:4px 16px 16px;
    border-top:1px solid var(--blue-line);
    background:var(--paper);
    font-size:0.85rem;
    line-height:1.5;
  }
  .entry.open .entry-body{display:block;}
  .entry-body dl{display:grid; grid-template-columns:150px 1fr; gap:6px 12px; margin:10px 0;}
  .entry-body dt{color:var(--muted);}
  .entry-body dd{margin:0;}
  .issue-block{
    margin-top:10px;
    padding:10px 12px;
    border-radius:8px;
    background:var(--red-bg);
    color:#7a2013;
    font-size:0.85rem;
  }
  .issue-block.minor{background:var(--amber-bg); color:#6e4a08;}
  .issue-block ul{margin:6px 0 0 18px; padding:0;}
  .actions{margin-top:12px; display:flex; gap:8px;}
  .actions button{
    font:inherit;
    font-size:0.8rem;
    padding:7px 14px;
    border-radius:7px;
    border:1px solid var(--blue);
    background:var(--blue);
    color:var(--white);
    cursor:pointer;
  }
  .actions button.secondary{
    background:var(--white);
    color:var(--blue);
  }
  .empty-state{
    text-align:center;
    color:var(--muted);
    padding:30px 10px;
    font-size:0.9rem;
  }
  footer{
    text-align:center;
    color:var(--muted);
    font-size:0.75rem;
    padding:20px;
  }
  code{background:var(--blue-pale); padding:1px 5px; border-radius:4px;}
</style>
</head>
<body>

<header>
  <div>
    <h1>AI Club Session Dashboard</h1>
    <p>Turing Education — weekly session feedback</p>
  </div>
  <div id="last-updated"></div>
</header>

<main>

  <div class="stat-row" id="stat-row"></div>

  <div class="panel">
    <div class="panel-head"><h2>Average student engagement, by school</h2></div>
    <div class="panel-body" id="school-bars"></div>
  </div>

  <div class="panel">
    <div class="panel-head">
      <h2>Session log</h2>
      <div class="filters">
        <select id="filter-school"><option value="">All schools</option></select>
        <select id="filter-severity">
          <option value="">All severities</option>
          <option value="major">Major issues</option>
          <option value="minor">Minor issues</option>
          <option value="ok">No issues</option>
        </select>
        <div class="toggle-group" id="filter-status">
          <button data-status="all" class="active">All</button>
          <button data-status="open">Open</button>
          <button data-status="resolved">Resolved</button>
        </div>
      </div>
    </div>
    <div class="panel-body" id="entries"></div>
  </div>

</main>

<footer>
  Data loaded from <code>feedback.csv</code> · Resolved status is saved in this browser only.
</footer>

<script>
/* =========================================================================
   AI CLUB SESSION DASHBOARD
   Self-contained static dashboard, designed to be hosted on GitHub Pages.
   No server / backend — "backend" logic (school matching, issue grading)
   runs client-side in this file, reading feedback.csv from the same repo.
   ========================================================================= */

/* -------------------------------------------------------------------------
   1. SCHOOL NAME MATCHING ("backend feature")
   Raw form responses spell school names inconsistently
   (e.g. "Brighton Prep", "Brighton College Prep", "Brighton school").
   This keyword table maps any name containing a keyword to one canonical
   name, so they're grouped as the same school everywhere in the dashboard.
   Add more rows here as new schools / spellings show up.
------------------------------------------------------------------------- */
const SCHOOL_ALIASES = [
  { keywords: ["brighton"],            canonical: "Brighton College Prep" },
  { keywords: ["beechwood"],           canonical: "Beechwood Park School" },
  { keywords: ["chelsea"],             canonical: "Chelsea Academy" },
  { keywords: ["st catherine", "st. catherine", "saint catherine"], canonical: "St Catherine's School" },
];

function normaliseSchool(raw) {
  const clean = (raw || "").trim().replace(/\s+/g, " ");
  const lower = clean.toLowerCase();
  for (const rule of SCHOOL_ALIASES) {
    if (rule.keywords.some(k => lower.includes(k))) return rule.canonical;
  }
  return clean || "Unknown school";
}

/* -------------------------------------------------------------------------
   2. ISSUE GRADING ("backend feature")
   Turns the worded / categorical form answers into a single severity:
   "major" (red, needs admin attention), "minor" (amber, worth a look),
   or "ok" (green, nothing flagged).

   Rules (adjust thresholds here if the team's definition changes):
   - Any safeguarding concern that isn't blank/"No"        -> always MAJOR
   - Technical problem marked "Yes - major"                -> MAJOR
   - Priority score of 4 or 5 AND follow-up isn't "No action needed" -> MAJOR
   - Technical problem marked "Yes - minor"                -> MINOR
   - Behavioural issue reported                            -> MINOR
   - Priority score of 1-3 with a follow-up action noted   -> MINOR
   - Anything else                                         -> OK
------------------------------------------------------------------------- */
function gradeIssue(row) {
  const reasons = [];
  let severity = "ok";

  const bump = (level, reason) => {
    reasons.push(reason);
    if (level === "major") severity = "major";
    else if (level === "minor" && severity !== "major") severity = "minor";
  };

  const safeguarding = (row["Were there any safeguarding concerns or incidents during the session? "] || "").trim();
  if (safeguarding && !/^no$/i.test(safeguarding)) {
    bump("major", `Safeguarding concern noted: "${safeguarding}"`);
  }

  const tech = (row["Did any significant technical problems occur?"] || "").trim();
  if (/major/i.test(tech)) {
    bump("major", `Technical problem: ${tech}`);
  } else if (/minor/i.test(tech)) {
    bump("minor", `Technical problem: ${tech}`);
  }

  const priorityRaw = (row["Priority"] || "").trim();
  const priority = priorityRaw ? parseInt(priorityRaw, 10) : null;
  const followUp = (row["Does anything need to change or be followed up? "] || "").trim();
  const hasFollowUp = followUp && !/no action needed/i.test(followUp);
  if (priority !== null && !isNaN(priority)) {
    if (priority >= 4 && hasFollowUp) {
      bump("major", `Priority ${priority}/5 — ${followUp}`);
    } else if (priority <= 3 && hasFollowUp) {
      bump("minor", `Priority ${priority}/5 — ${followUp}`);
    }
  } else if (hasFollowUp) {
    bump("minor", `Follow-up requested — ${followUp}`);
  }

  const behavioural = (row["Were there any significant behavioural issues during the session?  "] || "").trim();
  if (behavioural && !/^no$/i.test(behavioural)) {
    const desc = (row["Please briefly describe the behavioural issue.  "] || "").trim();
    bump("minor", `Behavioural issue${desc ? ": " + desc : ""}`);
  }

  return { severity, reasons };
}

/* -------------------------------------------------------------------------
   3. TINY CSV PARSER (handles quoted fields containing commas / newlines)
------------------------------------------------------------------------- */
function parseCSV(text) {
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i], next = text[i + 1];
    if (inQuotes) {
      if (c === '"' && next === '"') { field += '"'; i++; }
      else if (c === '"') { inQuotes = false; }
      else { field += c; }
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ',') { row.push(field); field = ""; }
      else if (c === '\r') { /* skip */ }
      else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ""; }
      else { field += c; }
    }
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  const headers = rows.shift();
  return rows.filter(r => r.some(v => v.trim() !== "")).map(r => {
    const obj = {};
    headers.forEach((h, i) => obj[h] = r[i] !== undefined ? r[i] : "");
    return obj;
  });
}

/* -------------------------------------------------------------------------
   4. STATE (resolved issues persist per-browser via localStorage)
------------------------------------------------------------------------- */
const RESOLVED_KEY = "aiclub_resolved_v1";
function loadResolved() {
  try { return JSON.parse(localStorage.getItem(RESOLVED_KEY) || "{}"); }
  catch { return {}; }
}
function saveResolved(map) {
  localStorage.setItem(RESOLVED_KEY, JSON.stringify(map));
}
let resolvedMap = loadResolved();

function rowId(row, idx) {
  // Time of review is intentionally NOT part of the identity or the display.
  return `${row["Which School did you attend"]}__${row["Date of session"]}__${row["Session / week number "]}__${idx}`;
}

let state = { school: "", severity: "", status: "all", data: [] };

/* -------------------------------------------------------------------------
   5. RENDERING
------------------------------------------------------------------------- */
function numOr(v, fallback) {
  const n = parseFloat(v);
  return isNaN(n) ? fallback : n;
}

function buildDashboard(data) {
  state.data = data.map((row, idx) => {
    const school = normaliseSchool(row["Which School did you attend"]);
    const { severity, reasons } = gradeIssue(row);
    return { row, idx, school, severity, reasons, id: rowId(row, idx) };
  });

  populateSchoolFilter();
  renderStats();
  renderSchoolBars();
  renderEntries();
}

function populateSchoolFilter() {
  const sel = document.getElementById("filter-school");
  const schools = [...new Set(state.data.map(d => d.school))].sort();
  schools.forEach(s => {
    const opt = document.createElement("option");
    opt.value = s; opt.textContent = s;
    sel.appendChild(opt);
  });
}

function renderStats() {
  const total = state.data.length;
  const schools = new Set(state.data.map(d => d.school)).size;
  const openMajor = state.data.filter(d => d.severity === "major" && !resolvedMap[d.id]).length;
  const openMinor = state.data.filter(d => d.severity === "minor" && !resolvedMap[d.id]).length;
  const avgEngagement = (state.data.reduce((s, d) => s + numOr(d.row["   Student engagement  "], 0), 0) / (total || 1)).toFixed(1);

  const cards = [
    { num: total, label: "Sessions logged" },
    { num: schools, label: "Schools" },
    { num: openMajor, label: "Open major issues", cls: openMajor ? "red" : "" },
    { num: openMinor, label: "Open minor issues", cls: openMinor ? "amber" : "" },
    { num: avgEngagement, label: "Avg. student engagement (/5)" },
  ];
  document.getElementById("stat-row").innerHTML = cards.map(c => `
    <div class="stat-card">
      <div class="num ${c.cls || ""}">${c.num}</div>
      <div class="label">${c.label}</div>
    </div>
  `).join("");
}

function renderSchoolBars() {
  const bySchool = {};
  state.data.forEach(d => {
    const v = numOr(d.row["   Student engagement  "], null);
    if (v === null) return;
    (bySchool[d.school] ||= []).push(v);
  });
  const rows = Object.entries(bySchool)
    .map(([school, vals]) => ({ school, avg: vals.reduce((a, b) => a + b, 0) / vals.length }))
    .sort((a, b) => b.avg - a.avg);

  document.getElementById("school-bars").innerHTML = rows.map(r => `
    <div class="school-bar-row">
      <div class="name" title="${r.school}">${r.school}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${(r.avg / 5) * 100}%"></div></div>
      <div class="score">${r.avg.toFixed(1)}</div>
    </div>
  `).join("") || `<div class="empty-state">No engagement scores yet.</div>`;
}

function fmtDate(d) {
  if (!d) return "—";
  const [day, month, year] = d.split("-");
  if (day && month && year) return `${day}/${month}/${year}`;
  return d;
}

function renderEntries() {
  const container = document.getElementById("entries");
  let items = state.data;

  if (state.school) items = items.filter(d => d.school === state.school);
  if (state.severity) items = items.filter(d => d.severity === state.severity);
  if (state.status === "open") items = items.filter(d => !resolvedMap[d.id]);
  if (state.status === "resolved") items = items.filter(d => resolvedMap[d.id]);

  if (!items.length) {
    container.innerHTML = `<div class="empty-state">No sessions match these filters.</div>`;
    return;
  }

  container.innerHTML = items.map(item => {
    const r = item.row;
    const resolved = !!resolvedMap[item.id];
    const badgeClass = item.severity;
    const badgeLabel = item.severity === "major" ? "Major issue" : item.severity === "minor" ? "Minor issue" : "No issue";

    const issueHtml = item.reasons.length ? `
      <div class="issue-block ${item.severity === "minor" ? "minor" : ""}">
        <strong>${item.severity === "major" ? "Needs admin attention" : "Worth reviewing"}</strong>
        <ul>${item.reasons.map(x => `<li>${x}</li>`).join("")}</ul>
      </div>` : "";

    return `
    <div class="entry ${item.severity === "major" ? "sev-major" : ""} ${resolved ? "resolved" : ""}" data-id="${item.id}">
      <div class="entry-head" onclick="toggleEntry('${item.id}')">
        <div class="entry-title">
          <span class="school">${item.school}</span>
          <span class="meta">${fmtDate(r["Date of session"])} · ${r["Session / week number "] || "—"} · ${r["Activity / topic  "] || "—"}</span>
        </div>
        <div class="badges">
          <span class="badge ${badgeClass}">${badgeLabel}</span>
          ${resolved ? '<span class="badge resolved">Resolved</span>' : ""}
        </div>
      </div>
      <div class="entry-body" id="body-${cssId(item.id)}">
        <dl>
          <dt>Teacher</dt><dd>${r["Teacher "] || "—"}</dd>
          <dt>Year group(s)</dt><dd>${r["  Year group(s)  "] || "—"}</dd>
          <dt>Students present</dt><dd>${r["Number of students present  "] || "—"}</dd>
          <dt>Session completed?</dt><dd>${r["Was the planned session completed? "] || "—"}</dd>
          <dt>Engagement / Enjoyment / Understanding</dt>
          <dd>${r["   Student engagement  "] || "—"} / ${r["Student Enjoyment"] || "—"} / ${r["Student Understanding"] || "—"} (out of 5)</dd>
          <dt>What worked well</dt><dd>${r["  What worked particularly well?  "] || "—"}</dd>
          <dt>Overall response</dt><dd>${r["  Overall, how did students respond to the session?  "] || "—"}</dd>
        </dl>
        ${issueHtml}
        <div class="actions">
          ${resolved
            ? `<button class="secondary" onclick="event.stopPropagation(); setResolved('${item.id}', false)">Reopen</button>`
            : `<button onclick="event.stopPropagation(); setResolved('${item.id}', true)">Mark resolved</button>`}
        </div>
      </div>
    </div>`;
  }).join("");
}

function cssId(id) { return id.replace(/[^a-zA-Z0-9]/g, "_"); }

function toggleEntry(id) {
  const el = document.querySelector(`.entry[data-id="${CSS.escape(id)}"]`);
  if (el) el.classList.toggle("open");
}

function setResolved(id, value) {
  resolvedMap = loadResolved();
  if (value) resolvedMap[id] = true; else delete resolvedMap[id];
  saveResolved(resolvedMap);
  renderStats();
  renderEntries();
}

/* -------------------------------------------------------------------------
   6. FILTER WIRING
------------------------------------------------------------------------- */
document.getElementById("filter-school").addEventListener("change", e => {
  state.school = e.target.value; renderEntries();
});
document.getElementById("filter-severity").addEventListener("change", e => {
  state.severity = e.target.value; renderEntries();
});
document.querySelectorAll("#filter-status button").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll("#filter-status button").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    state.status = btn.dataset.status;
    renderEntries();
  });
});

/* -------------------------------------------------------------------------
   7. LOAD DATA
------------------------------------------------------------------------- */
fetch("feedback.csv")
  .then(r => {
    if (!r.ok) throw new Error("feedback.csv not found");
    return r.text();
  })
  .then(text => {
    buildDashboard(parseCSV(text));
    document.getElementById("last-updated").textContent =
      "Loaded " + new Date().toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
  })
  .catch(err => {
    document.getElementById("entries").innerHTML =
      `<div class="empty-state">Couldn't load feedback.csv — make sure it sits next to index.html in the repo.<br><small>${err.message}</small></div>`;
  });
</script>

</body>
</html>
